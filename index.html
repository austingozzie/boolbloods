<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bool Bloods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#1B4332; --field-dark:#12281E; --chalk:#F7F5EF; --gold:#D4A73F; --navy:#12181F; --red:#B3261E;
    --line:rgba(23,27,21,0.14); --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#EFEBE0; --text:#171B15; --text-dim:#5B6058;
    --shadow:0 1px 0 rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0E1410; --surface:#161D18; --surface-2:#1E2620; --text:#F2F1EA; --text-dim:#9AA39B; --line:rgba(247,245,239,0.12); --shadow:0 1px 0 rgba(0,0,0,0.4); }
  }
  :root[data-theme="dark"]{ --bg:#0E1410; --surface:#161D18; --surface-2:#1E2620; --text:#F2F1EA; --text-dim:#9AA39B; --line:rgba(247,245,239,0.12); --shadow:0 1px 0 rgba(0,0,0,0.4); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;letter-spacing:0.01em;}
  #app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:linear-gradient(180deg,var(--navy),#0A0D10);color:var(--chalk);padding:14px 16px 0 16px;position:sticky;top:0;z-index:20;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:0.02em;color:var(--gold);}
  .brand .sub{font-size:12px;color:#9DA79E;}
  .user-chip{font-size:13px;color:#C9CFC7;background:rgba(255,255,255,0.06);padding:6px 10px;border-radius:3px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;}
  .tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{background:none;border:none;color:#8B958C;font-family:'Barlow Condensed';font-size:16px;font-weight:600;padding:10px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--chalk);border-bottom-color:var(--gold);}
  .tab-btn:hover{color:var(--chalk);}
  main{flex:1;padding:16px 16px 60px 16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-title{font-size:20px;margin:0 0 4px 0;}
  .card-sub{font-size:13px;color:var(--text-dim);margin:0 0 14px 0;}
  .yard-divider{border:none;border-top:1px dashed var(--line);margin:14px 0;}
  button{font-family:inherit;cursor:pointer;}
  .btn{background:var(--field);color:var(--chalk);border:none;border-radius:3px;padding:10px 16px;font-size:14px;font-weight:600;font-family:'Source Sans 3';}
  .btn:hover{background:var(--field-dark);}
  .btn.gold{background:var(--gold);color:#231A02;}
  .btn.gold:hover{filter:brightness(0.95);}
  .btn.ghost{background:transparent;color:var(--field);border:1px solid var(--field);}
  :root[data-theme="dark"] .btn.ghost{color:var(--chalk);border-color:var(--line);}
  @media (prefers-color-scheme:dark){ .btn.ghost{color:var(--chalk);border-color:var(--line);} }
  .btn.danger{background:var(--red);color:#fff;}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  input,select,textarea{font-family:'Source Sans 3';font-size:15px;padding:9px 10px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);width:100%;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin:10px 0 4px 0;}
  .field{margin-bottom:2px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .error{color:var(--red);font-size:13px;margin-top:8px;}
  .notice{background:var(--surface-2);border-left:3px solid var(--gold);padding:8px 12px;font-size:13px;border-radius:2px;margin-bottom:12px;color:var(--text-dim);}

  .login-card{max-width:380px;width:100%;}
  .login-tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .login-tab{flex:1;text-align:center;padding:10px;font-family:'Barlow Condensed';font-size:17px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .login-tab.active{color:var(--text);border-bottom-color:var(--gold);}
  .game{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden;}
  .game-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);font-size:12px;color:var(--text-dim);}
  .game-body{padding:12px;}

  .team-btn{flex:1;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);display:flex;flex-direction:column;gap:2px;}

  .team-btn.selected{background:var(--field);border-color:var(--field);}
  .team-btn.selected .name,.team-btn.selected .spread{color:var(--chalk);}
  .modifiers{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);}

  .pts-badge{font-family:'Barlow Condensed';font-weight:700;font-size:13px;background:var(--navy);color:var(--gold);padding:3px 8px;border-radius:3px;}
  .result-tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:0.03em;}

  th{text-align:left;font-family:'Barlow Condensed';font-size:13px;color:var(--text-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr.me{background:rgba(212,167,63,0.12);}
  .rank{font-family:'Barlow Condensed';font-weight:700;font-size:16px;color:var(--text-dim);}
  .pts-cell{font-family:'Barlow Condensed';font-weight:700;font-size:17px;}

  .toggle-group button{background:none;border:none;padding:7px 14px;font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:var(--text-dim);border-radius:2px;}
  .toggle-group button.active{background:var(--field);color:var(--chalk);}
  .log-entry{border-bottom:1px solid var(--line);padding:10px 0;}
  .log-entry:last-child{border-bottom:none;}

  .empty .disp{font-size:22px;color:var(--text);margin-bottom:6px;}
  .espn-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .espn-row input[type=checkbox]{width:auto;}
  .espn-row .g-teams{flex:1;}
  .espn-row .g-spread{color:var(--text-dim);font-size:12.5px;}
  .espn-row .g-pts{width:64px;}
  ::selection{background:var(--gold);color:#231A02;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (max-width:480px){ .matchup{flex-direction:column;} .row{flex-direction:column;} }
</style>

<script>
(function(){
"use strict";

/* ====================== SUPABASE CONFIG ======================
   Dedicated Supabase project for Bool Bloods (separate from the
   golf pool project). Run the SQL block at the bottom of this file
   (in comments) once in this project's SQL editor before first use. */
const SB_URL = "https://yklqugyhspohksclyrsa.supabase.co";
const SB_KEY = "sb_publishable_cz_OF-A1UI_QUxzxYmf7Eg_0BiFjSZF";

async function sb(path, opts={}){
  const res = await fetch(SB_URL+path, {
    ...opts,
    headers: {
      "apikey": SB_KEY, "Authorization": "Bearer "+SB_KEY, "Content-Type": "application/json",
      "Prefer": opts.prefer || "", ...(opts.headers||{})
    }
  });
  if(!res.ok){ console.error("Supabase error", res.status, await res.text().catch(()=>"")); throw new Error("Supabase request failed ("+res.status+")"); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

const LEAGUE_ID = 1; // single-row config table

// ---------- helpers ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTs(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const SPORT_LABELS = {ncaaf:"NCAAF", nfl:"NFL"};
function weekLabel(week){ return week ? SPORT_LABELS[week.sport]+" Week "+week.week_num : ""; }

// ---------- state ----------
let STATE = { users:{}, owner:null, commissioners:[], weeks:{}, weekOrder:[], currentWeek:null, log:[] };
let ME = null;
let ROUTE = "picks";
let LOADING = true;
let AUTH_MODE = "login";
let AUTH_ERR = "";

// ---------- data access (Supabase) ----------
async function loadAll(){
  const [users, league, weeks, log] = await Promise.all([
    sb("/rest/v1/bb_users?select=*"),
    sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID+"&select=*"),
    sb("/rest/v1/bb_weeks?select=*,bb_games(*)&order=created_at.asc"),
    sb("/rest/v1/bb_log?select=*&order=ts.desc&limit=300")
  ]);
  STATE.users = {};
  (users||[]).forEach(u=> STATE.users[u.username] = {email:u.email, passHash:u.pass_hash, joinedAt:u.joined_at});
  const lg = (league||[])[0];
  STATE.owner = lg ? lg.owner : null;
  STATE.commissioners = lg ? (lg.commissioners || (lg.commissioner ? [lg.commissioner] : [])) : [];
  STATE.currentWeek = lg ? lg.current_week : null;
  STATE.weeks = {}; STATE.weekOrder = [];
  (weeks||[]).forEach(w=>{
    STATE.weeks[w.id] = {
      sport:w.sport, week_num:w.week_num, finalized:w.finalized, locked:w.locked, created_at:w.created_at,
      games: (w.bb_games||[]).map(g=>({
        id:g.id, away:g.away, home:g.home, favorite:g.favorite, spread:Number(g.spread), points:Number(g.points),
        kickoff:g.kickoff, dayLabel:g.day_label, espnId:g.espn_id,
        result: g.has_result ? {awayScore:g.away_score, homeScore:g.home_score} : null
      })).sort((a,b)=> (a.kickoff||"").localeCompare(b.kickoff||""))
    };
    STATE.weekOrder.push(w.id);
  });
  STATE.log = (log||[]).map(l=>({ts:new Date(l.ts).getTime(), actor:l.actor, action:l.action, detail:l.detail}));
}

async function ensureLeagueRow(){
  const existing = await sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID+"&select=id");
  if(!existing || existing.length===0){
    await sb("/rest/v1/bb_league", {method:"POST", prefer:"return=minimal", body: JSON.stringify({id:LEAGUE_ID, owner:null, commissioners:[], current_week:null})});
  }
}
async function patchLeague(fields){
  await sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID, {method:"PATCH", prefer:"return=minimal", body: JSON.stringify(fields)});
}

async function loadPicksFor(weekId, username){
  const rows = await sb("/rest/v1/bb_picks?week_id=eq."+encodeURIComponent(weekId)+"&username=eq."+encodeURIComponent(username)+"&select=picks");
  return (rows && rows[0]) ? rows[0].picks : {};
}
async function savePicksFor(weekId, username, picks){
  await sb("/rest/v1/bb_picks", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body: JSON.stringify({week_id:weekId, username, picks, updated_at:new Date().toISOString()})
  });
}

async function loadAdjustment(weekId, username){
  const rows = await sb("/rest/v1/bb_adjustments?week_id=eq."+encodeURIComponent(weekId)+"&username=eq."+encodeURIComponent(username)+"&select=amount,note");
  return (rows && rows[0]) ? {amount:Number(rows[0].amount)||0, note:rows[0].note||""} : {amount:0, note:""};
}
async function saveAdjustment(weekId, username, amount, note){
  await sb("/rest/v1/bb_adjustments", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body: JSON.stringify({week_id:weekId, username, amount, note, updated_at:new Date().toISOString()})
  });
}

async function addLog(action, detail){
  const entry = {ts:Date.now(), actor:ME, action, detail};
  STATE.log.unshift(entry);
  await sb("/rest/v1/bb_log", {method:"POST", prefer:"return=minimal", body: JSON.stringify({actor:ME, action, detail})});
}

// ---------- ESPN live fetch ----------
async function fetchEspnSlate(sport, weekNum){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const groups = sport==="ncaaf" ? "&groups=80" : "";
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/${league}/scoreboard?week=${weekNum}&seasontype=2${groups}&limit=400`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("ESPN request failed ("+res.status+")");
  const data = await res.json();
  const events = data.events || [];
  return events.map(ev=>{
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return null;
    const competitors = comp.competitors || [];
    const homeC = competitors.find(c=>c.homeAway==="home");
    const awayC = competitors.find(c=>c.homeAway==="away");
    if(!homeC || !awayC) return null;
    let favorite = "home", spread = 0;
    const oddsArr = comp.odds || [];
    if(oddsArr.length){
      const o = oddsArr[0];
      if(typeof o.spread === "number"){
        // ESPN convention: negative spread = home favored
        spread = Math.abs(o.spread);
        favorite = o.spread < 0 ? "home" : (o.spread > 0 ? "away" : "home");
      } else if(o.details){
        const m = o.details.match(/(-?\d+(\.\d+)?)/);
        if(m){
          spread = Math.abs(Number(m[1]));
          const favAbbr = o.details.split(" ")[0];
          favorite = (homeC.team && (homeC.team.abbreviation===favAbbr)) ? "home" : "away";
        }
      }
    }
    return {
      espnId: ev.id,
      away: awayC.team ? (awayC.team.shortDisplayName||awayC.team.displayName) : "TBD",
      home: homeC.team ? (homeC.team.shortDisplayName||homeC.team.displayName) : "TBD",
      favorite, spread,
      kickoff: comp.date || ev.date || null,
      dayLabel: comp.date ? new Date(comp.date).toLocaleDateString(undefined,{weekday:"short"}) : ""
    };
  }).filter(Boolean);
}

// ---------- pick locking (Thu kickoff / Sat 11am CDT cutoff) ----------
function addDaysToYmd(ymd, days){
  const [y,m,d] = ymd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 12, 0, 0));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
}
function chicagoInfo(dateObj){
  const wd = new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short"}).format(dateObj);
  const ymd = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(dateObj);
  return {wd, ymd};
}
// Returns a Date for 11:00am CDT on the Saturday of this week's slate, or null if the
// week has no Thu/Fri/Sat games to anchor from (e.g. a Sun/Mon-only slate).
function weekSaturdayCutoff(week){
  if(week._satCutoffCached !== undefined) return week._satCutoffCached;
  const withKickoff = (week.games||[]).filter(g=>g.kickoff);
  if(!withKickoff.length){ week._satCutoffCached = null; return null; }
  const info = withKickoff.map(g=>({g, ...chicagoInfo(new Date(g.kickoff))}));
  let satYmd = (info.find(x=>x.wd==="Sat")||{}).ymd;
  if(!satYmd){
    const anchors = info.filter(x=>x.wd==="Thu"||x.wd==="Fri").sort((a,b)=>new Date(a.g.kickoff)-new Date(b.g.kickoff));
    if(!anchors.length){ week._satCutoffCached = null; return null; }
    const anchor = anchors[0];
    satYmd = addDaysToYmd(anchor.ymd, anchor.wd==="Thu"?2:1);
  }
  const cutoff = new Date(satYmd+"T11:00:00-05:00");
  week._satCutoffCached = cutoff;
  return cutoff;
}
function gameLockTime(g, week){
  const cutoff = weekSaturdayCutoff(week);
  const kickoffMs = g.kickoff ? new Date(g.kickoff).getTime() : Infinity;
  const cutoffMs = cutoff ? cutoff.getTime() : Infinity;
  return Math.min(kickoffMs, cutoffMs);
}
function isGameLocked(g, week){
  return Date.now() >= gameLockTime(g, week);
}

// ---------- pick activity log ----------
async function loadPickActivity(weekId, username){
  const rows = await sb("/rest/v1/bb_pick_activity?week_id=eq."+encodeURIComponent(weekId)+"&username=eq."+encodeURIComponent(username)+"&select=*&order=ts.desc&limit=50");
  return rows||[];
}
async function logPickActivity(weekId, username, pickCount, by){
  await sb("/rest/v1/bb_pick_activity", {method:"POST", prefer:"return=minimal", body: JSON.stringify({week_id:weekId, username, pick_count:pickCount, made_by:by})});
}

// ---------- ESPN result auto-sync ----------
const ESPN_SCORE_CACHE = {};
async function fetchEspnScores(sport, weekNum){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const groups = sport==="ncaaf" ? "&groups=80" : "";
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/${league}/scoreboard?week=${weekNum}&seasontype=2${groups}&limit=400`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("ESPN request failed ("+res.status+")");
  const data = await res.json();
  const map = {};
  (data.events||[]).forEach(ev=>{
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return;
    const competitors = comp.competitors || [];
    const homeC = competitors.find(c=>c.homeAway==="home");
    const awayC = competitors.find(c=>c.homeAway==="away");
    const completed = !!(comp.status && comp.status.type && comp.status.type.completed);
    map[ev.id] = { completed, homeScore: homeC?Number(homeC.score):null, awayScore: awayC?Number(awayC.score):null };
  });
  return map;
}
async function getEspnScoresCached(sport, weekNum){
  const key = sport+":"+weekNum;
  const c = ESPN_SCORE_CACHE[key];
  if(c && (Date.now()-c.ts) < 30000) return c.data;
  const data = await fetchEspnScores(sport, weekNum);
  ESPN_SCORE_CACHE[key] = {ts:Date.now(), data};
  return data;
}
// Fills in any missing results for a finalized week straight from ESPN. Never
// overwrites a result that's already been entered (manual corrections stick).
async function syncWeekResults(week){
  if(!week || !week.finalized) return false;
  const pending = (week.games||[]).filter(g=>!g.result && g.espnId);
  if(!pending.length) return false;
  let scores;
  try{ scores = await getEspnScoresCached(week.sport, week.week_num); }catch(e){ return false; }
  let changed = false;
  for(const g of pending){
    const s = scores[g.espnId];
    if(s && s.completed && s.homeScore!=null && s.awayScore!=null){
      await sb("/rest/v1/bb_games?id=eq."+encodeURIComponent(g.id), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({away_score:s.awayScore, home_score:s.homeScore, has_result:true})});
      g.result = {awayScore:s.awayScore, homeScore:s.homeScore};
      changed = true;
      if(week.locked) await addLog("Result auto-synced from ESPN", `${g.away} ${s.awayScore} — ${g.home} ${s.homeScore}`);
    }
  }
  return changed;
}

// ---------- grading (same rules as before) ----------
function marginForFavorite(game){ const {homeScore, awayScore} = game.result; return game.favorite==="home" ? (homeScore-awayScore) : (awayScore-homeScore); }
function coverResult(game, side, teaserAdj){
  if(!game.result) return null;
  const marginFav = marginForFavorite(game);
  const spread = Number(game.spread);
  if(side===game.favorite){
    const need = teaserAdj ? spread-6 : spread;
    if(marginFav>need) return "win"; if(marginFav===need) return "push"; return "loss";
  } else {
    const need = teaserAdj ? spread+6 : spread;
    if(marginFav<need) return "win"; if(marginFav===need) return "push"; return "loss";
  }
}
function scoreWeek(week, picks, adjustment){
  adjustment = adjustment || 0;
  let total=0, wins=0, losses=0, pushes=0; const perGame={}; const parlayGameIds=[]; const teaserGameIds=[];
  for(const g of week.games){
    const p = picks[g.id]; if(!p || !p.side) continue;
    const base = coverResult(g, p.side, false); let pts=0;
    if(base==="win"){ pts = p.star? g.points*2 : g.points; wins++; }
    else if(base==="loss"){ pts = p.star? -g.points*2 : 0; losses++; }
    else if(base==="push"){ pts=0; pushes++; }
    perGame[g.id] = {base, pts, side:p.side, star:!!p.star, parlay:!!p.parlay, teaser:!!p.teaser};
    total += pts;
    if(p.parlay) parlayGameIds.push(g.id);
    if(p.teaser) teaserGameIds.push(g.id);
  }
  let parlayBonus=0, parlayStatus=null;
  if(parlayGameIds.length===3){
    const results = parlayGameIds.map(id=>{ const g=week.games.find(x=>x.id===id); return coverResult(g, picks[id].side, false); });
    if(results.some(r=>r===null)) parlayStatus="pending";
    else if(results.every(r=>r==="win")){ parlayBonus=3; parlayStatus="hit"; }
    else parlayStatus="miss";
  }
  let teaserBonus=0, teaserStatus=null;
  if(teaserGameIds.length===2){
    const results = teaserGameIds.map(id=>{ const g=week.games.find(x=>x.id===id); return coverResult(g, picks[id].side, true); });
    if(results.some(r=>r===null)) teaserStatus="pending";
    else if(results.every(r=>r==="win")){ teaserBonus=2; teaserStatus="hit"; }
    else { teaserBonus=-2; teaserStatus="miss"; }
  }
  total += parlayBonus + teaserBonus;
  total += adjustment;
  return {total, wins, losses, pushes, perGame, parlayBonus, parlayStatus, teaserBonus, teaserStatus, parlayGameIds, teaserGameIds, adjustment};
}

function countMods(picks, key){ return Object.values(picks).filter(p=>p && p[key]).length; }

function renderPickGames(main, week, weekId, picks, forUser, editable, respectLock){
  const parlayCount = countMods(picks,"parlay"); const teaserCount = countMods(picks,"teaser");
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">${esc(weekLabel(week))}</h2>
      <p class="card-sub">${week.games.length} game${week.games.length===1?"":"s"} · picks against the spread</p>
      <div class="notice">Parlay needs exactly 3 games marked · currently <strong>${parlayCount}/3</strong>. Teaser needs exactly 2 games marked (±6 pts) · currently <strong>${teaserCount}/2</strong>.
      ${respectLock?`<br>Picks lock per game at kickoff, and everything remaining locks at 11am CDT Saturday.`:""}</div>
      ${respectLock?`<button class="btn ghost sm" id="refresh-scores-btn" style="margin-bottom:10px;">↻ Refresh scores</button>`:""}
      <div id="games-list"></div>
      ${editable?`<button class="btn gold" id="save-picks-btn" style="width:100%;margin-top:6px;">Save picks</button><div id="save-msg" style="font-size:13px;margin-top:8px;"></div>`:""}
    </div>`;
  const list = document.getElementById("games-list");
  list.innerHTML = week.games.map(g=>{
    const locked = respectLock && isGameLocked(g,week);
    return gameCardHtml(g, picks[g.id]||{}, editable && !locked, locked);
  }).join("");
  const refreshBtn = document.getElementById("refresh-scores-btn");
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    refreshBtn.textContent = "Checking ESPN…"; refreshBtn.disabled = true;
    try{ await syncWeekResults(week); }catch(e){}
    renderPickGames(main, week, weekId, picks, forUser, editable, respectLock);
  };
  if(editable){
    week.games.forEach(g=>{
      const locked = respectLock && isGameLocked(g,week);
      if(locked) return;
      const el = document.getElementById("game-"+g.id); if(!el) return;
      el.querySelectorAll(".team-btn").forEach(btn=>{
        btn.onclick = ()=>{ const side=btn.dataset.side; picks[g.id]=picks[g.id]||{}; picks[g.id].side = picks[g.id].side===side?null:side; renderPickGames(main, week, weekId, picks, forUser, editable, respectLock); };
      });
      el.querySelectorAll(".chip").forEach(chip=>{
        chip.onclick = ()=>{ picks[g.id]=picks[g.id]||{}; const key=chip.dataset.mod; picks[g.id][key]=!picks[g.id][key]; renderPickGames(main, week, weekId, picks, forUser, editable, respectLock); };
      });
    });
    document.getElementById("save-picks-btn").onclick = async ()=>{
      const clean={}; for(const [gid,p] of Object.entries(picks)){ if(p && p.side) clean[gid]=p; }
      await savePicksFor(weekId, forUser, clean);
      await logPickActivity(weekId, forUser, Object.keys(clean).length, forUser===ME ? forUser : ME);
      document.getElementById("save-msg").textContent = "Saved.";
      document.getElementById("save-msg").style.color = "var(--field)";
    };
  }
}
function gameCardHtml(g, pick, editable, locked){
  const spreadTxt = `-${g.spread}`;

  const awayCover = result ? coverResult(g,"away",false) : null;

  return `
    <div class="game" id="game-${g.id}">
      <div class="game-head">
        <span>${esc(g.dayLabel||"")} ${g.kickoff?"· "+new Date(g.kickoff).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}):""}</span>
        <span style="display:flex;gap:6px;align-items:center;">${locked?`<span class="result-tag loss">LOCKED</span>`:""}<span class="pts-badge">${g.points} PT${g.points===1?"":"S"}</span></span>
      </div>

          <button class="team-btn ${pick.side==='away'?'selected':''}" data-side="away" ${editable?"":"disabled"}>
            <span class="name">${esc(g.away)}</span><span class="spread">${g.favorite==='away'?spreadTxt:'+'+g.spread}</span>
            ${result?`<span class="result-tag ${awayCover}" style="margin-top:4px;width:fit-content;">${awayCover}</span>`:""}
          </button>
          <button class="team-btn ${pick.side==='home'?'selected':''}" data-side="home" ${editable?"":"disabled"}>
            <span class="name">${esc(g.home)}</span><span class="spread">${g.favorite==='home'?spreadTxt:'+'+g.spread}</span>
            ${result?`<span class="result-tag ${homeCover}" style="margin-top:4px;width:fit-content;">${homeCover}</span>`:""}
          </button>
        </div>
        <div class="modifiers">
          <button class="chip ${pick.star?'on':''}" data-mod="star" ${editable?"":"disabled"}>★ Star (×2 / −×2)</button>
          <button class="chip ${pick.parlay?'on':''}" data-mod="parlay" ${editable?"":"disabled"}>Parlay leg (+3 if 3/3)</button>
          <button class="chip ${pick.teaser?'on':''}" data-mod="teaser" ${editable?"":"disabled"}>Teaser leg (±6, ±2)</button>
        </div>
      </div>
    </div>`;
}

      <div class="field"><label>Sport</label><select id="nw-sport"><option value="ncaaf">NCAAF</option><option value="nfl">NFL</option></select></div>
      <div class="field"><label>Week #</label><input id="nw-num" type="number" min="0" value="1"></div>
    </div>
    <button class="btn sm" id="nw-create-btn" style="margin-top:10px;">Create draft week</button>`;
  document.getElementById("nw-create-btn").onclick = async ()=>{
    const sport=document.getElementById("nw-sport").value;
    const weekNum=Number(document.getElementById("nw-num").value)||0;
    const id = sport+"-"+weekNum+"-"+uid().slice(0,4);
    await sb("/rest/v1/bb_weeks", {method:"POST", prefer:"return=minimal", body: JSON.stringify({id, sport, week_num:weekNum, finalized:false, locked:false})});
    STATE.weeks[id] = {sport, week_num:weekNum, finalized:false, locked:false, games:[]};
    STATE.weekOrder.push(id);
    COMMISH_DRAFT_WEEK=id; ESPN_SLATE=[];
    renderCommishPage(document.getElementById("main"));
  };
}

async function renderCommishWeekEditor(main){
  const week = STATE.weeks[COMMISH_DRAFT_WEEK];
  const editor = document.getElementById("commish-week-editor");
  if(!editor) return;
  const locked = week.finalized;
  editor.innerHTML = `
    <div class="yard-divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong>${esc(weekLabel(week))}</strong><span class="result-tag ${locked?'loss':'win'}">${locked?"LOCKED":"DRAFT"}</span>
    </div>

    <div id="games-editor" style="margin-top:12px;${locked?"opacity:0.55;pointer-events:none;":""}"></div>

      </h4>
      <p class="card-sub" style="margin-top:0;">Live ${SPORT_LABELS[week.sport]} Week ${week.week_num} slate with current spreads. Check games to add, edit points, then add selected.</p>

      <button class="btn sm" id="espn-add-btn" style="margin-top:8px;">Add selected games</button>
      <div class="yard-divider"></div>
      <h4 style="margin:0 0 8px 0;">Add manually</h4>
      <div class="row">

        <div class="field"><label>Favorite</label><select id="ng-fav"><option value="home">Home</option><option value="away">Away</option></select></div>

        <div class="field"><label>Points value</label><input id="ng-points" type="number" min="1" value="1"></div>
      </div>
      <button class="btn ghost sm" id="add-game-btn" style="margin-top:8px;">Add game</button>
      <div class="yard-divider"></div>
      <button class="btn gold" id="finalize-btn" style="width:100%;">Finalize &amp; lock this week</button>
    `:`<button class="btn gold" id="relock-btn" style="width:100%;margin-top:10px;">Re-lock week</button>`}
    <div class="yard-divider"></div>
    <h4 style="margin:0 0 8px 0;">Results</h4>
    <div id="results-editor"></div>`;

  renderGamesEditor(); renderResultsEditor();
  if(week.finalized){ syncWeekResults(week).then(changed=>{ if(changed) renderResultsEditor(); }).catch(()=>{}); }

  if(!locked){
    loadEspnSlate();

    document.getElementById("add-game-btn").onclick = async ()=>{
      const away=document.getElementById("ng-away").value.trim();
      const home=document.getElementById("ng-home").value.trim();
      if(!away||!home){ alert("Enter both teams."); return; }
      const g = { id:uid(), away, home, favorite:document.getElementById("ng-fav").value,
        spread:Number(document.getElementById("ng-spread").value)||0, points:Number(document.getElementById("ng-points").value)||1,
        kickoff:null, dayLabel:"", result:null };
      await addGameToWeek(g);
      if(week.locked) await addLog("Added game (post-lock)", `${away} @ ${home} — ${weekLabel(week)}`);
      renderCommishWeekEditor(main);
    };
    document.getElementById("finalize-btn").onclick = async ()=>{
      if(week.games.length===0){ alert("Add at least one game first."); return; }
      await sb("/rest/v1/bb_weeks?id=eq."+encodeURIComponent(COMMISH_DRAFT_WEEK), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({finalized:true, locked:true})});

      await addLog("Unlocked week", weekLabel(week));

      await sb("/rest/v1/bb_weeks?id=eq."+encodeURIComponent(COMMISH_DRAFT_WEEK), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({finalized:true})});
      week.finalized=true;
      await addLog("Re-locked week", weekLabel(week));
      renderCommishWeekEditor(main);
    };
  }

async function loadEspnSlate(isRefresh){
  const week = STATE.weeks[COMMISH_DRAFT_WEEK];
  const listEl = document.getElementById("espn-list");
  if(!listEl) return;
  ESPN_LOADING = true; ESPN_ERR="";
  listEl.innerHTML = `<div class="card-sub">Fetching live ${SPORT_LABELS[week.sport]} Week ${week.week_num} games from ESPN…</div>`;
  try{
    ESPN_SLATE = await fetchEspnSlate(week.sport, week.week_num);
    if(isRefresh && week.locked) await addLog("Refreshed ESPN odds (post-lock)", `${SPORT_LABELS[week.sport]} Week ${week.week_num}`);
  }catch(err){
    ESPN_ERR = err.message || "Couldn't reach ESPN.";
    ESPN_SLATE = [];
  }
  ESPN_LOADING = false;
  renderEspnList();
}
function renderEspnList(){
  const listEl = document.getElementById("espn-list"); if(!listEl) return;
  if(ESPN_ERR){ listEl.innerHTML = `<div class="error">${esc(ESPN_ERR)} — GitHub Pages allows this fetch; if you're previewing outside the hosted site it may be blocked locally.</div>`; return; }
  if(ESPN_SLATE.length===0){ listEl.innerHTML = `<div class="card-sub">No games found for this week yet.</div>`; return; }
  listEl.innerHTML = ESPN_SLATE.map((g,i)=>`
    <div class="espn-row">
      <input type="checkbox" id="espn-chk-${i}">
      <div class="g-teams"><strong>${esc(g.away)}</strong> @ <strong>${esc(g.home)}</strong>
        <div class="g-spread">${g.favorite==='home'?esc(g.home):esc(g.away)} -${g.spread||0}${g.kickoff?" · "+new Date(g.kickoff).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}):""}</div>
      </div>
      <input class="g-pts" type="number" min="1" value="1" id="espn-pts-${i}">
    </div>`).join("");
  document.getElementById("espn-add-btn").onclick = async ()=>{
    let added=0;
    for(let i=0;i<ESPN_SLATE.length;i++){
      const chk=document.getElementById("espn-chk-"+i);
      if(chk && chk.checked){
        const g=ESPN_SLATE[i];
        const pts=Number(document.getElementById("espn-pts-"+i).value)||1;
        await addGameToWeek({ id:uid(), away:g.away, home:g.home, favorite:g.favorite, spread:g.spread, points:pts, kickoff:g.kickoff, dayLabel:g.dayLabel, espnId:g.espnId, result:null });
        added++;
      }
    }
    if(added){
      const week = STATE.weeks[COMMISH_DRAFT_WEEK];
      if(week.locked) await addLog("Added games from ESPN (post-lock)", `${added} game(s) added to ${weekLabel(week)}`);
      renderCommishWeekEditor(document.getElementById("main"));
    }
    else alert("Check at least one game first.");
  };
}

async function addGameToWeek(g){
  const week = STATE.weeks[COMMISH_DRAFT_WEEK];
  await sb("/rest/v1/bb_games", {method:"POST", prefer:"return=minimal", body: JSON.stringify({
    id:g.id, week_id:COMMISH_DRAFT_WEEK, away:g.away, home:g.home, favorite:g.favorite, spread:g.spread, points:g.points,
    kickoff:g.kickoff, day_label:g.dayLabel, espn_id:g.espnId||null, has_result:false
  })});
  week.games.push(g);
}

function renderGamesEditor(){
  const week=STATE.weeks[COMMISH_DRAFT_WEEK]; const el=document.getElementById("games-editor"); if(!el) return;
  if(week.games.length===0){ el.innerHTML=`<div class="card-sub">No games yet.</div>`; return; }
  el.innerHTML = week.games.map(g=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
      <div style="font-size:14px;"><strong>${esc(g.away)}</strong> @ <strong>${esc(g.home)}</strong>
        <span style="color:var(--text-dim);"> · ${g.favorite==='home'?esc(g.home):esc(g.away)} -${g.spread} · ${g.points}pt</span></div>
      <button class="btn danger sm" data-rm="${g.id}">Remove</button>
    </div>`).join("");
  el.querySelectorAll("[data-rm]").forEach(btn=>{
    btn.onclick = async ()=>{
      const gid=btn.dataset.rm; const g=week.games.find(x=>x.id===gid);
      await sb("/rest/v1/bb_games?id=eq."+encodeURIComponent(gid), {method:"DELETE", prefer:"return=minimal"});
      week.games = week.games.filter(x=>x.id!==gid);
      if(week.locked) await addLog("Removed game (post-lock)", `${g.away} @ ${g.home} — ${weekLabel(week)}`);
      renderCommishWeekEditor(document.getElementById("main"));
    };
  });
}

function renderResultsEditor(){
  const week=STATE.weeks[COMMISH_DRAFT_WEEK]; const el=document.getElementById("results-editor"); if(!el) return;
  if(week.games.length===0){ el.innerHTML=`<div class="card-sub">Add games to enter results.</div>`; return; }
  el.innerHTML = week.games.map(g=>`
    <div style="padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="font-size:14px;margin-bottom:6px;"><strong>${esc(g.away)}</strong> @ <strong>${esc(g.home)}</strong></div>
      <div class="row">
        <div class="field" style="margin:0;"><label>${esc(g.away)} score</label><input type="number" id="rs-away-${g.id}" value="${g.result?g.result.awayScore:''}"></div>
        <div class="field" style="margin:0;"><label>${esc(g.home)} score</label><input type="number" id="rs-home-${g.id}" value="${g.result?g.result.homeScore:''}"></div>
        <div class="field" style="display:flex;align-items:flex-end;margin:0;"><button class="btn ghost sm" data-save-res="${g.id}" style="width:100%;">Save</button></div>
      </div>
    </div>`).join("");
  el.querySelectorAll("[data-save-res]").forEach(btn=>{
    btn.onclick = async ()=>{
      const gid=btn.dataset.saveRes; const g=STATE.weeks[COMMISH_DRAFT_WEEK].games.find(x=>x.id===gid);
      const a=Number(document.getElementById("rs-away-"+gid).value); const h=Number(document.getElementById("rs-home-"+gid).value);
      if(isNaN(a)||isNaN(h)){ alert("Enter both scores."); return; }
      await sb("/rest/v1/bb_games?id=eq."+encodeURIComponent(gid), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({away_score:a, home_score:h, has_result:true})});
      g.result = {awayScore:a, homeScore:h};
      if(STATE.weeks[COMMISH_DRAFT_WEEK].locked) await addLog("Entered result", `${g.away} ${a} — ${g.home} ${h}`);
      renderResultsEditor();
    };
  });
}

async function renderTimeTravel(main){
  const body=document.getElementById("tt-body"); const week=STATE.weeks[COMMISH_TT_WEEK];
  if(!week){ body.innerHTML=`<div class="empty">Pick a week.</div>`; return; }
  const picks = await loadPicksFor(COMMISH_TT_WEEK, COMMISH_TT_USER);
  body.innerHTML = `<div class="notice">Editing picks for <strong>${esc(COMMISH_TT_USER)}</strong> — ${esc(weekLabel(week))}. Saving logs a retroactive-pick entry.</div><div id="tt-games"></div><button class="btn gold sm" id="tt-save-btn" style="margin-top:10px;">Save on their behalf</button>`;
  renderPickGames(document.getElementById("tt-games"), week, COMMISH_TT_WEEK, picks, COMMISH_TT_USER, true, false);
  const innerSave=document.getElementById("save-picks-btn"); if(innerSave) innerSave.style.display="none";
  document.getElementById("tt-save-btn").onclick = async ()=>{
    const clean={}; for(const [gid,p] of Object.entries(picks)){ if(p && p.side) clean[gid]=p; }
    await savePicksFor(COMMISH_TT_WEEK, COMMISH_TT_USER, clean);
    await logPickActivity(COMMISH_TT_WEEK, COMMISH_TT_USER, Object.keys(clean).length, ME);
    await addLog("Set picks on behalf of member", `${COMMISH_TT_USER} — ${weekLabel(week)} (entered by commissioner)`);
    alert("Saved picks for "+COMMISH_TT_USER);
  };
}

// ---------- Score Audit (commissioner) ----------
let AUDIT_USER=null, AUDIT_WEEK=null;
async function renderAuditPage(main){
  if(!AUDIT_USER) AUDIT_USER=ME;
  if(!AUDIT_WEEK) AUDIT_WEEK=STATE.currentWeek;
  const usernames = Object.keys(STATE.users);
  const weekIds = STATE.weekOrder; // commissioner can audit draft weeks too, not just finalized ones
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">Score Audit</h2>
      <p class="card-sub">See exactly how a member's score was calculated for a week, and correct it if needed.</p>
      <div class="row">
        <div class="field"><label>Member</label><select id="audit-user-select">
          ${usernames.map(u=>`<option value="${u}" ${u===AUDIT_USER?"selected":""}>${esc(u)}</option>`).join("")}
        </select></div>
        <div class="field"><label>Week</label><select id="audit-week-select">
          ${weekIds.length? weekIds.map(id=>`<option value="${id}" ${id===AUDIT_WEEK?"selected":""}>${esc(weekLabel(STATE.weeks[id]))}</option>`).join("") : `<option>No weeks yet</option>`}
        </select></div>
      </div>
      <div id="audit-body" style="margin-top:14px;"></div>
    </div>`;
  document.getElementById("audit-user-select").onchange=(e)=>{AUDIT_USER=e.target.value;renderAuditPage(main);};
  const wsel=document.getElementById("audit-week-select"); if(wsel) wsel.onchange=(e)=>{AUDIT_WEEK=e.target.value;renderAuditPage(main);};
  const body=document.getElementById("audit-body");
  if(!AUDIT_WEEK || !STATE.weeks[AUDIT_WEEK]){ body.innerHTML=`<div class="empty">No weeks yet.</div>`; return; }
  const week = STATE.weeks[AUDIT_WEEK];
  const picks = await loadPicksFor(AUDIT_WEEK, AUDIT_USER);
  const adj = await loadAdjustment(AUDIT_WEEK, AUDIT_USER);
  const s = scoreWeek(week, picks, adj.amount);
  const activity = await loadPickActivity(AUDIT_WEEK, AUDIT_USER);

  const rowsHtml = week.games.map(g=>{
    const p = picks[g.id];
    const pg = s.perGame[g.id];
    if(!p || !p.side){
      return `<tr><td>${esc(g.away)} @ ${esc(g.home)}</td><td style="color:var(--text-dim);">no pick</td><td>—</td><td style="text-align:right;">0</td></tr>`;
    }
    const sideTeam = p.side==="home"?g.home:g.away;
    const mods = [p.star?"★":"", p.parlay?"Parlay":"", p.teaser?"Teaser":""].filter(Boolean).join(" · ") || "—";
    const cover = pg ? pg.base : (g.result? coverResult(g,p.side,false) : "pending");
    return `<tr>
      <td>${esc(g.away)} @ ${esc(g.home)}</td>
      <td>${esc(sideTeam)}</td>
      <td>${cover||"pending"} <span style="color:var(--text-dim);font-size:12px;">${mods}</span></td>
      <td style="text-align:right;" class="${pg&&pg.pts>0?'pts-cell pos':pg&&pg.pts<0?'pts-cell neg':''}">${pg?(pg.pts>0?"+":"")+pg.pts:"—"}</td>
    </tr>`;
  }).join("");

  body.innerHTML = `
    <table>
      <thead><tr><th>Game</th><th>Picked</th><th>Result</th><th style="text-align:right;">Pts</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="yard-divider"></div>
    <div style="font-size:14px;line-height:1.9;">
      Base picks: ${s.wins}-${s.losses}${s.pushes?`-${s.pushes}`:""}<br>
      Parlay: ${s.parlayStatus?`${s.parlayStatus} (${s.parlayBonus>0?"+":""}${s.parlayBonus})`:"not attempted"}<br>
      Teaser: ${s.teaserStatus?`${s.teaserStatus} (${s.teaserBonus>0?"+":""}${s.teaserBonus})`:"not attempted"}<br>
      Commissioner adjustment: ${s.adjustment>0?"+":""}${s.adjustment}${adj.note?` — "${esc(adj.note)}"`:""}<br>
      <strong style="font-size:18px;">Total: ${s.total>0?"+":""}${s.total}</strong>
    </div>
    <div class="yard-divider"></div>
    <h4 style="margin:0 0 8px 0;">Manual adjustment</h4>
    <p class="card-sub" style="margin-top:0;">Adds or subtracts points directly, on top of everything above. Applies to the leaderboard and history everywhere.</p>
    <div class="row">
      <div class="field"><label>Adjustment (+/-)</label><input type="number" id="audit-adj-amount" value="${adj.amount}"></div>
      <div class="field"><label>Reason (optional)</label><input type="text" id="audit-adj-note" value="${esc(adj.note)}" placeholder="e.g. scoring error on game 3"></div>
    </div>
    <button class="btn gold sm" id="audit-adj-save" style="margin-top:8px;">Save adjustment</button>
    <div id="audit-adj-msg" style="font-size:13px;margin-top:8px;"></div>
    <div class="yard-divider"></div>
    <h4 style="margin:0 0 8px 0;">Pick activity</h4>
    <p class="card-sub" style="margin-top:0;">Every time picks were saved for this member this week.</p>
    ${activity.length===0?`<div class="card-sub">No saves recorded yet.</div>`:
      activity.map(a=>`<div class="log-entry"><div class="log-ts">${fmtTs(new Date(a.ts).getTime())}</div>
        <div class="log-desc">${a.pick_count} game${a.pick_count===1?"":"s"} picked${a.made_by && a.made_by!==AUDIT_USER?` — entered by ${esc(a.made_by)}`:""}</div></div>`).join("")}
  `;
  document.getElementById("audit-adj-save").onclick = async ()=>{
    const amount = Number(document.getElementById("audit-adj-amount").value)||0;
    const note = document.getElementById("audit-adj-note").value.trim();
    await saveAdjustment(AUDIT_WEEK, AUDIT_USER, amount, note);
    await addLog("Manual score adjustment", `${AUDIT_USER} — ${weekLabel(week)} — ${amount>0?"+":""}${amount}${note?` (${note})`:""}`);
    document.getElementById("audit-adj-msg").textContent = "Saved.";
    document.getElementById("audit-adj-msg").style.color = "var(--field)";
  };
}

// ---------- Owner ----------
function renderOwnerPage(main){
  const usernames=Object.keys(STATE.users);
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">League Setup</h2>
      <p class="card-sub">Owner controls — appoint who runs the weekly slate. Check as many as you want.</p>
      <label>Commissioners</label>
      <div id="commish-checks">
        ${usernames.map(u=>`
          <label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;font-weight:400;color:var(--text);margin:0;">
            <input type="checkbox" style="width:auto;" data-commish-check value="${esc(u)}" ${STATE.commissioners.includes(u)?"checked":""}>
            ${esc(u)}
          </label>`).join("")}
      </div>
      <button class="btn sm" id="set-commish-btn" style="margin-top:10px;">Save commissioners</button>
      <div class="yard-divider"></div>
      <h4 style="margin:0 0 8px 0;">Members (${usernames.length})</h4>
      ${usernames.map(u=>`<div style="padding:6px 0;font-size:14px;">${esc(u)} <span style="color:var(--text-dim);font-size:12px;">${u===STATE.owner?"· owner":""}${STATE.commissioners.includes(u)?" · commissioner":""}</span></div>`).join("")}
    </div>`;
  document.getElementById("set-commish-btn").onclick = async ()=>{
    const checked = Array.from(document.querySelectorAll("[data-commish-check]:checked")).map(el=>el.value);
    const before = STATE.commissioners;
    await patchLeague({commissioners: checked});
    STATE.commissioners = checked;
    const added = checked.filter(u=>!before.includes(u));
    const removed = before.filter(u=>!checked.includes(u));
    let detail = [];
    if(added.length) detail.push(`added ${added.join(", ")}`);
    if(removed.length) detail.push(`removed ${removed.join(", ")}`);
    await addLog("Commissioners updated", detail.length? detail.join(" · ") : "No change.");
    renderOwnerPage(main);
  };
}

// ---------- boot ----------
async function boot(){
  try{
    await ensureLeagueRow();
    await loadAll();
  }catch(err){
    LOADING=false;
    app.innerHTML = `<div class="login-wrap"><div class="card login-card"><h2 class="card-title">Can't reach the database</h2><p class="card-sub">${esc(err.message||String(err))}</p><p style="font-size:13px;color:var(--text-dim);">Make sure the setup SQL has been run in Supabase and this page is served over https (GitHub Pages, not opened as a local file).</p></div></div>`;
    return;
  }
  const saved = localGet("boolbloodsUser");
  if(saved && STATE.users[saved]) ME = saved;
  LOADING = false;
  render();
}
boot();

})();

create table if not exists bb_users (

  id text primary key,

  week_num int not null,

  locked boolean default false,
  created_at timestamptz default now()
);

create table if not exists bb_games (
  id text primary key,
  week_id text references bb_weeks(id) on delete cascade,

);

create table if not exists bb_picks (
  week_id text not null,
  username text not null,
  picks jsonb not null default '{}'::jsonb,
  updated_at timestamptz default now(),
  primary key (week_id, username)
